<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 470" width="1230" height="470" role="img" aria-label="AI Agent Studio 구성">
<title>AI Agent Studio 구성</title>
<style>
  .bg{fill:#08090a}
  .box{fill:#191a1b;stroke:rgba(255,255,255,0.08);stroke-width:1}
  .group{fill:rgba(255,255,255,0.02);stroke:#34343a;stroke-width:1;stroke-dasharray:4 4}
  .pill{fill:#0f1011;stroke:rgba(255,255,255,0.08)}
  .brand{fill:#DA291C}
  .t1{fill:#f7f8f8;font:500 16px 'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:-0.2px}
  .t2{fill:#d0d6e0;font:400 13px 'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Arial,sans-serif}
  .gt{fill:#8a8f98;font:500 12px 'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:0.4px}
  .mono{fill:#8a8f98;font:400 12px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .edge{fill:#d0d6e0;font:400 12px 'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Arial,sans-serif}
  .ln{stroke:#62666d;stroke-width:1.5;fill:none}
  .ln.dash{stroke-dasharray:6 5}
  .ah{fill:#62666d}
  @media (prefers-color-scheme: light){
    .bg{fill:#edeef2}
    .box{fill:#f5f6f9;stroke:rgba(0,0,0,0.10)}
    .group{fill:rgba(0,0,0,0.02);stroke:#d1d5db}
    .pill{fill:#edeef2;stroke:rgba(0,0,0,0.10)}
    .t1{fill:#111827}.t2,.edge{fill:#4b5563}.gt,.mono{fill:#6b7280}
    .ln{stroke:#9ca3af}.ah{fill:#9ca3af}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="1230" height="470"/>
<rect class="box" x="24" y="214" width="120" height="72" rx="10"/>
<text class="t1" x="84" y="256" text-anchor="middle">브라우저</text>
<rect class="box" x="270" y="170" width="230" height="160" rx="10"/>
<rect class="brand" x="270" y="188" width="3" height="40"/>
<text class="t1" x="385" y="212" text-anchor="middle">AI Agent Studio</text>
<text class="t2" x="385" y="236" text-anchor="middle">서버 + 웹 화면</text>
<text class="mono" x="385" y="260" text-anchor="middle">포트 17900</text>
<line class="ln" x1="286" y1="282" x2="484" y2="282" style="stroke-width:1;opacity:.5"/>
<text class="mono" x="385" y="308" text-anchor="middle">aas-data · aas-config</text>
<rect class="group" x="620" y="28" width="300" height="236" rx="12"/>
<text class="gt" x="640" y="54" text-anchor="start">Hermes Agent 컨테이너</text>
<rect class="box" x="640" y="72" width="260" height="80" rx="10"/>
<text class="t1" x="770" y="106" text-anchor="middle">대시보드 API</text>
<text class="mono" x="770" y="130" text-anchor="middle">포트 9119</text>
<rect class="box" x="640" y="166" width="260" height="80" rx="10"/>
<text class="t1" x="770" y="200" text-anchor="middle">게이트웨이</text>
<text class="t2" x="770" y="224" text-anchor="middle">예약 작업 · 메신저 채널</text>
<rect class="box" x="640" y="360" width="260" height="76" rx="10"/>
<text class="t1" x="770" y="392" text-anchor="middle">읽기 사이드카</text>
<text class="mono" x="770" y="416" text-anchor="middle">포트 17950 · 읽기 전용</text>
<path class="box" d="M1010,262 v104 a100,13 0 0 0 200,0 v-104"/>
<ellipse class="box" cx="1110" cy="262" rx="100" ry="13"/>
<text class="t1" x="1110" y="306" text-anchor="middle">Hermes 데이터 폴더</text>
<text class="mono" x="1110" y="330" text-anchor="middle">hermes-data</text>
<text class="mono" x="1110" y="348" text-anchor="middle">/opt/data</text>
<rect class="box" x="1010" y="68" width="200" height="92" rx="10"/>
<text class="t1" x="1110" y="100" text-anchor="middle">OpenAI 호환 LLM</text>
<text class="mono" x="1110" y="124" text-anchor="middle">Ollama · OpenAI</text>
<text class="mono" x="1110" y="142" text-anchor="middle">LiteLLM · vLLM</text>
<line class="ln" x1="144" y1="250" x2="266" y2="250" marker-end="url(#a)"/>
<rect class="pill" x="148.2" y="261" width="117.6" height="22" rx="11"/><text class="edge" x="207" y="277" text-anchor="middle">HTTP · WebSocket</text>
<path class="ln" d="M500,205 C560,205 560,112 636,112" marker-end="url(#a)"/>
<rect class="pill" x="513.6" y="147" width="92.8" height="22" rx="11"/><text class="edge" x="560" y="163" text-anchor="middle">바꾸기 · 대화</text>
<path class="ln dash" d="M500,295 C560,295 560,398 636,398" marker-end="url(#a)"/>
<rect class="pill" x="538.8" y="337" width="42.4" height="22" rx="11"/><text class="edge" x="560" y="353" text-anchor="middle">읽기</text>
<line class="ln" x1="900" y1="112" x2="1006" y2="112" marker-end="url(#a)"/>
<rect class="pill" x="919.8" y="79" width="70.4" height="22" rx="11"/><text class="edge" x="955" y="95" text-anchor="middle">모델 호출</text>
<path class="ln" d="M904,206 C960,206 960,300 1006,300" marker-start="url(#a)" marker-end="url(#a)"/>
<rect class="pill" x="914.7" y="243" width="80.6" height="22" rx="11"/><text class="edge" x="955" y="259" text-anchor="middle">읽기 · 쓰기</text>
<path class="ln dash" d="M1010,350 C960,350 960,398 904,398" marker-end="url(#a)"/>
<rect class="pill" x="919.8" y="361" width="70.4" height="22" rx="11"/><text class="edge" x="955" y="377" text-anchor="middle">읽기 전용</text>
