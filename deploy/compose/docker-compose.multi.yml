# AAS 로컬 시험 환경 — Hermes 여러 개(R22). 사용자마다 Hermes 가 하나씩 생기는 쿠버네티스 구조를 한 컴퓨터에서 흉내 낸다.
#   - Hermes 3개(one·two·three): 각자 데이터 볼륨과 대시보드(9119)를 갖는다. 사용자 Hermes 파드와 같다.
#   - 읽기 사이드카 3개: Hermes 마다 하나. 자기 Hermes 의 데이터 볼륨만 읽기 전용으로 붙인다(파드 안 사이드카와 같다).
#   - AAS 서버 1개: Hermes 폴더를 직접 붙이지 않고, 사이드카(읽기)와 대시보드 API(쓰기·대화)로만 닿는다.
# 빠른 시작(docker-compose.yml)은 Hermes 하나, 붙기(docker-compose.attach.yml)는 이미 돌고 있는 Hermes 에 붙는다. 이 파일은 따로 쓴다(프로젝트 이름 aas-multi).
#   docker compose -f docker-compose.multi.yml up -d --build
# 사용법과 한계: README.md 「Hermes 여러 개로 시험하기」
name: aas-multi

x-hermes: &hermes
  # 기본은 상류 공개 이미지. 다른 이미지로 시험하려면 .env 에 HERMES_IMAGE 와 그 이미지의 시작 명령 HERMES_COMMAND 를 적는다(README)
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.22.2}
  restart: unless-stopped
  depends_on:
    hermes-seed: {condition: service_completed_successfully}
  # 상류 이미지: 대시보드는 s6 서비스(HERMES_DASHBOARD=1), 게이트웨이(크론·채널)는 이 명령으로 함께 뜬다
  command: ${HERMES_COMMAND:-gateway run}
  environment:
    HERMES_UID: ${HERMES_UID:-10000}
    HERMES_GID: ${HERMES_GID:-10000}
    HERMES_DASHBOARD: "1"
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-aas}
    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD 를 .env 에 정하세요(Hermes 대시보드 로그인 비밀번호)}
    GATEWAY_MULTIPLEX_PROFILES: "true"
    # 프로파일 AGENTS.md 패치를 켠다(패치를 적용한 이미지만 읽는다. 상류 이미지는 무시한다)
    AAS_PROFILE_INSTRUCTIONS: "1"
    # 모델: hermes-config.seed.yaml 이 이 셋을 참조하고, hermes-seed 가 기본 프로파일 .env 에도 넣는다. 기본은 호스트의 LiteLLM(OKE 에 연결하는 터널: oke-litellm.sh).
    HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-http://host.docker.internal:14400/v1}
    HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
    HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9119), 3)"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s

x-sidecar: &sidecar
  build:
    context: ../../sidecar
  image: ${AAS_SIDECAR_IMAGE:-ghcr.io/openmaru-io/cogentai-aas-sidecar:${AAS_VERSION:-latest}}
  pull_policy: missing
  restart: unless-stopped
  # Hermes 와 같은 사용자로 읽는다. state.db·.env 같은 파일이 소유자만 읽도록(0600) 만들어지므로, 다른 사용자로는 읽지 못한다.
  # 쿠버네티스에서 사이드카가 Hermes 와 같은 파드 보안 설정(runAsUser)을 쓰는 것과 같다.
  user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
  environment:
    AAS_SIDECAR_TOKEN: "${AAS_SIDECAR_TOKEN:?AAS_SIDECAR_TOKEN 을 .env 에 정하세요(16자 이상)}"
    AAS_SIDECAR_MAX_ENTRIES: ${AAS_SIDECAR_MAX_ENTRIES:-}
  healthcheck:
    test: ["CMD", "python", "-m", "aas_sidecar", "check"]
    interval: 10s
    timeout: 5s
    retries: 6

services:
  hermes-seed:
    image: busybox:1.36
    # 세 Hermes 의 설정 파일과 기본 프로파일 .env 의 LLM 값을 없을 때만 넣고 끝난다(hermes-seed.sh)
    command: ["sh", "/seed/hermes-seed.sh", "/d/one", "/d/two", "/d/three"]
    environment:
      HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-http://host.docker.internal:14400/v1}
      HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
      HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-one-data:/d/one
      - hermes-two-data:/d/two
      - hermes-three-data:/d/three
      - ./hermes-config.seed.yaml:/seed/config.yaml:ro
      - ./hermes-seed.sh:/seed/hermes-seed.sh:ro

  aas:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${AAS_IMAGE:-ghcr.io/openmaru-io/cogentai-aas-server:${AAS_VERSION:-latest}}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      sidecar-one: {condition: service_healthy}
      sidecar-two: {condition: service_healthy}
      sidecar-three: {condition: service_healthy}
      hermes-one: {condition: service_healthy}
      hermes-two: {condition: service_healthy}
      hermes-three: {condition: service_healthy}
    ports:
      - "${AAS_BIND:-127.0.0.1}:${AAS_PORT:-17900}:17900"
    environment:
      AAS_DATA_DIR: /data
      AAS_CONFIG_DIR: /etc/aas
      AAS_PODS_FILE: /etc/aas-pods/pods.json
      AAS_SIDECAR_TOKEN: "${AAS_SIDECAR_TOKEN:?AAS_SIDECAR_TOKEN 을 .env 에 정하세요(16자 이상)}"
      AAS_TREE_SKIP_DIRS_EXTRA: ${AAS_TREE_SKIP_DIRS_EXTRA:-}
      HERMES_DASHBOARD_USER: ${HERMES_DASHBOARD_USER:-aas}
      HERMES_DASHBOARD_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?HERMES_DASHBOARD_PASSWORD 를 .env 에 정하세요}
      AAS_LITELLM_URL: ${AAS_LITELLM_URL:-http://host.docker.internal:14400}
      AAS_LITELLM_KEY: ${HERMES_LLM_API_KEY:-}
      # 모델 화면·AI 보조는 Hermes 와 같은 기본 주소를 쓴다(쿠버네티스가 아니라서). 접두어 cogentai-aas 는 그대로(LiteLLM)
      HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-http://host.docker.internal:14400/v1}
      HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
      AAS_MARKET_TAG_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
      AAS_SKILL_SUMMARY_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
      AAS_SKILL_DESC_MODEL: ${HERMES_LLM_MODEL:-cogentai-aas}
      # 첫 관리자: 계정이 하나도 없을 때만 만든다. e2e-multi.py 의 기본 비밀번호를 쓰려면 AAS_ADMIN_PASSWORD=multi-aas-pass-123
      AAS_ADMIN_EMAIL: ${AAS_ADMIN_EMAIL:-admin@example.com}
      AAS_ADMIN_PASSWORD: ${AAS_ADMIN_PASSWORD:-}
      AAS_ADMINS: ${AAS_ADMINS:-${AAS_ADMIN_EMAIL:-admin@example.com}}
      AAS_ALLOWED_HOSTS: ${AAS_ALLOWED_HOSTS:-localhost:${AAS_PORT:-17900},127.0.0.1:${AAS_PORT:-17900}}
      AAS_MARKET_INSTALL: "off"
      # 화면이 웹소켓(/ws) 하나로 받는다. 기본은 켜짐 — off 면 HTTP 폴링·SSE 로 받는다
      AAS_WS: ${AAS_WS:-on}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aas-data:/data
      - aas-config:/etc/aas
      - ./pods.multi.json:/etc/aas-pods/pods.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:17900/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  hermes-one:
    <<: *hermes
    volumes: ["hermes-one-data:/opt/data"]
  hermes-two:
    <<: *hermes
    volumes: ["hermes-two-data:/opt/data"]
  hermes-three:
    <<: *hermes
    volumes: ["hermes-three-data:/opt/data"]

  sidecar-one:
    <<: *sidecar
    volumes: ["hermes-one-data:/opt/data:ro"]
  sidecar-two:
    <<: *sidecar
    volumes: ["hermes-two-data:/opt/data:ro"]
  sidecar-three:
    <<: *sidecar
    volumes: ["hermes-three-data:/opt/data:ro"]

volumes:
  aas-data:
  aas-config:
  hermes-one-data:
  hermes-two-data:
  hermes-three-data:
