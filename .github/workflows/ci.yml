#
# Tests and the DCO check for pull requests and for each push to main.
# We do not merge pull requests on GitHub (see CONTRIBUTING.md). These checks tell the reviewer that a change is ready.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the server and sidecar tests
        run: make test-python PYTHON=python3

  ui:
    name: Web UI (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      # Build first: src/airgap.test.ts also checks the real build output in aas/static.
      - name: Build (includes the air-gap check of the output)
        run: npm run build
      - run: npx vitest run

  dco:
    name: DCO (Signed-off-by)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line for its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git show -s --format='%ae' "$c")"
            if ! git show -s --format='%B' "$c" | grep -qiE "^Signed-off-by: .+ <${email//./\\.}>\s*$"; then
              echo "::error::Commit $(git show -s --format='%h %s' "$c") has no 'Signed-off-by: ... <${email}>' line."
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Sign off each commit with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
